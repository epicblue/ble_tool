include ':app'

/*
 * 构建环境自检
 *
 * AGP 8.7 / Gradle 8.10 需要 JDK 17 及以上。若终端里的 JAVA_HOME 仍是 JDK 8（或 11），
 * Gradle 只会抛出一段很难读的 "No matching variant of com.android.tools.build:gradle"
 * 报错，所以这里提前给出明确提示。
 */
def currentJava = JavaVersion.current()
def major = 0
try {
    major = currentJava.majorVersion.split("\\.")[0] as Integer
} catch (Exception ignored) {
    major = 8
}

if (major < 17 || major > 23) {
    def hint = major < 17
            ? "版本过低：Android Gradle Plugin 8.7 与 CameraX / ML Kit 都要求 JDK 17+。"
            : "版本过新：Gradle 8.10 最高支持 JDK 23，请改用 JDK 17 或 21。"
    throw new GradleException("""
================================================================================
构建失败：当前 Gradle 运行在 Java ${major}（${currentJava}）上。
${hint}
推荐使用 JDK 17（Android Studio 自带的 JetBrains Runtime 17 即可）。
================================================================================

【Android Studio（推荐，一次性解决）】
  Windows: File → Settings → Build, Execution, Deployment → Build Tools → Gradle
  macOS:   Android Studio → Settings → 同上
  → Gradle JDK 选择 "jbr-17"（Embedded JDK 17）或本地 JDK 17
  → File → Sync Project with Gradle Files，然后重新 Build APK。

【命令行（Windows PowerShell / CMD）】
  set JAVA_HOME=C:\\Program Files\\Android\\Android Studio\\jbr
  gradlew.bat clean assembleDebug

  只想本次生效：
  gradlew.bat -Dorg.gradle.java.home="C:\\Program Files\\Android\\Android Studio\\jbr" clean assembleDebug

【命令行（macOS / Linux）】
  export JAVA_HOME=/usr/lib/jvm/jdk-17
  ./gradlew clean assembleDebug

【永久生效（可选，只改自己电脑，不要提交）】
  %USERPROFILE%\\.gradle\\gradle.properties   或   ~/.gradle/gradle.properties
  追加一行（路径可以直接用正斜杠，不用纠结转义）：
  org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

【确认当前版本】
  gradlew -version        → 查看 "JVM:" 一行是否为 17.x / 21.x
  java -version
================================================================================
""")
}

/*
 * Android SDK 路径自检（只提示，不中断构建）
 *
 * 优先级：local.properties 的 sdk.dir > 环境变量 ANDROID_HOME / ANDROID_SDK_ROOT。
 * 没配置时 Gradle 只会抛 "SDK location not found"，这里提前给出中文说明。
 */
gradle.projectsLoaded { gradleInstance ->
    def currentDir = gradleInstance.startParameter.currentDir
    String sdkDir = null

    def propsFile = new File(currentDir, 'local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def value = props.getProperty('sdk.dir')
        if (value != null && value.trim().length() > 0) {
            sdkDir = value.trim()
        }
    }
    if (sdkDir == null || sdkDir.length() == 0) {
        sdkDir = System.getenv('ANDROID_HOME')
        if (sdkDir == null || sdkDir.length() == 0) {
            sdkDir = System.getenv('ANDROID_SDK_ROOT')
        }
    }

    def hintPrefix = System.lineSeparator() + '=' * 60 + System.lineSeparator()
    if (sdkDir == null || sdkDir.length() == 0) {
        println hintPrefix +
                '[提示] 没有找到 Android SDK 路径，请任选一种方式配置：' + System.lineSeparator() +
                '  1) 在项目根目录新建 local.properties（可复制 local.properties.example）：' + System.lineSeparator() +
                '       sdk.dir=E:/Android/Sdk' + System.lineSeparator() +
                '     （用反斜杠的话要写成 E:\\Android\\Sdk）' + System.lineSeparator() +
                '  2) 设置环境变量 ANDROID_HOME=E:\\Android\\Sdk' + System.lineSeparator() +
                '  3) Android Studio → Settings → Languages & Frameworks → Android SDK → 设置 SDK Location' +
                System.lineSeparator() + '=' * 60
    } else {
        def dir = new File(sdkDir)
        if (!dir.exists() || !new File(dir, 'platforms').exists()) {
            println hintPrefix +
                    '[提示] SDK 路径 ' + sdkDir + ' 不存在或缺少 platforms 目录。' + System.lineSeparator() +
                    ' 请用 SDK Manager 安装 Android SDK Platform 34 与 Build-Tools 34.0.0，' + System.lineSeparator() +
                    ' 或修改 local.properties 中的 sdk.dir 指向正确的 SDK 目录。' +
                    System.lineSeparator() + '=' * 60
        }
    }
}
